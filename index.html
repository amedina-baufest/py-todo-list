<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List - Simple Task Manager</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 16 16" version="1.1" width="32" height="32">
                        <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
                    </svg>
                    <h1 class="title">TODO List</h1>
                </div>
                <p class="subtitle">Gestiona tus tareas de forma simple</p>
            </div>
            <button class="theme-toggle-btn" id="themeToggle" title="Cambiar tema" aria-label="Cambiar tema">🌙</button>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Create Todo Section -->
            <section class="create-todo-section">
                <div class="create-todo-card">
                    <h2 class="section-title">Crear nueva tarea</h2>
                    <form id="createTodoForm" class="form">
                        <div class="form-group">
                            <label for="todoTitle" class="form-label">Título *</label>
                            <input 
                                type="text" 
                                id="todoTitle" 
                                class="form-input" 
                                placeholder="Ej: Comprar leche"
                                required
                            >
                        </div>
                        <div class="form-group">
                            <label for="todoDescription" class="form-label">Descripción</label>
                            <textarea 
                                id="todoDescription" 
                                class="form-textarea" 
                                placeholder="Ej: En el supermercado cerca de casa"
                                rows="3"
                            ></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <span class="btn-icon">+</span>
                            Crear tarea
                        </button>
                    </form>
                </div>
            </section>

            <!-- Filter Section -->
            <section class="filter-section">
                <div class="filter-buttons">
                    <button class="filter-btn filter-active" data-filter="all">Todas</button>
                    <button class="filter-btn" data-filter="active">Pendientes</button>
                    <button class="filter-btn" data-filter="completed">Completadas</button>
                </div>
                <div class="todo-stats">
                    <span id="totalCount" class="stat-item">Total: 0</span>
                    <span id="activeCount" class="stat-item">Pendientes: 0</span>
                    <span id="completedCount" class="stat-item">Completadas: 0</span>
                </div>
            </section>

            <!-- Charts Section -->
            <section class="charts-section">
                <div class="chart-container">
                    <h2 class="section-title">Resumen de tareas</h2>
                    <canvas id="tasksChart"></canvas>
                </div>
            </section>

            <!-- Todos List Section -->
            <section class="todos-section">
                <div id="todosContainer" class="todos-grid">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>Cargando tareas...</p>
                    </div>
                </div>
            </section>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
                </svg>
                <h3>No hay tareas</h3>
                <p>Crea una nueva tarea para empezar</p>
            </div>
        </main>

        <!-- Edit Modal -->
        <div id="editModal" class="modal" style="display: none;">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title">Editar tarea</h2>
                    <button type="button" class="modal-close" id="closeModal">×</button>
                </div>
                <form id="editTodoForm" class="form">
                    <div class="form-group">
                        <label for="editTitle" class="form-label">Título *</label>
                        <input 
                            type="text" 
                            id="editTitle" 
                            class="form-input" 
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="editDescription" class="form-label">Descripción</label>
                        <textarea 
                            id="editDescription" 
                            class="form-textarea" 
                            rows="3"
                        ></textarea>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" id="cancelEdit">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="toast" style="display: none;"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
